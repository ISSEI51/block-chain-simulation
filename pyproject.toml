[project]
name = "blockchain-thesis"
version = "0.1.0"
description = "卒業研究用：ブロックチェーンの基本構造を理解するための教育用シミュレーター"
readme = "README.md"
requires-python = ">=3.12"
# 実行時の依存は標準ライブラリのみ
dependencies = []

[project.optional-dependencies]
# 実験1のグラフ作成にだけ使う
plot = ["matplotlib>=3.8"]

[project.scripts]
blockchain = "blockchain.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blockchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "experiments"]
strict = true
